name: kewpie_cup
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.20.0
  audioplayers: ^6.0.0
  shared_preferences: ^2.3.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D0D11"
  adaptive_icon_foreground: "assets/images/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/images/icon/app_icon.png"
    background_color: "#0D0D11"
    theme_color: "#0D0D11"

flutter:
  uses-material-design: true

  assets:
    - assets/images/stage/
    - assets/audio/sfx/
